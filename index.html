<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>영어 문장 학습</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body data-theme="blue">
  <div id="app"></div>
  <script src="config.js?v=2"></script>
  <script src="app.js?v=2"></script>
<script data-goatcounter="https://sohwi-english.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(function () {
  var KEY = 'es_visitor_name';
  var name = '';
  try { name = localStorage.getItem(KEY) || ''; } catch (e) {}

  if (!name) {
    name = (prompt('이름을 입력해 주세요.\n(입력한 이름이 방문 기록에 남아요)') || '').trim();
    if (name) { try { localStorage.setItem(KEY, name); } catch (e) {} }
  }
  if (!name) return;

  var tries = 0;
  var timer = setInterval(function () {
    tries++;
    if (window.goatcounter && window.goatcounter.count) {
      clearInterval(timer);
      window.goatcounter.count({ path: '방문자/' + name, title: name, event: true });
    } else if (tries > 50) {
      clearInterval(timer);
    }
  }, 200);
})();
</script>
</body>
</html>
